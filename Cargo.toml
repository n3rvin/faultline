[workspace]
resolver = "3"
members = [
    "crates/faultline-core",
    "crates/faultline-lang",
    "crates/faultline-analyzers",
    "crates/faultline-report",
    "crates/faultline-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/n3rvin/faultline"
authors = ["Ervin Nagypál"]

[workspace.dependencies]
faultline-core = { path = "crates/faultline-core", version = "0.0.1" }
faultline-lang = { path = "crates/faultline-lang", version = "0.0.1" }
faultline-analyzers = { path = "crates/faultline-analyzers", version = "0.0.1" }
faultline-report = { path = "crates/faultline-report", version = "0.0.1" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
